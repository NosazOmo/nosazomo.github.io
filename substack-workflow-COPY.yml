name: Update Substack articles

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the article list
        run: python scripts/update_substack.py
      - name: Save changes
        run: |
          if git diff --quiet; then
            echo "Nothing new."
          else
            git config user.name "substack-bot"
            git config user.email "substack-bot@users.noreply.github.com"
            git commit -am "Add new Substack post"
            git push
          fi
